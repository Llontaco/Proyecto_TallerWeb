# Integración continua: cada push y cada pull request se compila y se prueba en 3 etapas.
#  1. backend   – pruebas unitarias + integración (H2) y cobertura JaCoCo ≥ 60 %
#  2. frontend  – pruebas con Vitest y build de producción
#  3. integración – levanta el stack completo con Docker Compose y ejecuta
#                   las pruebas de API (Newman) y end-to-end (Playwright)
name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pruebas y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar, probar y verificar cobertura
        run: mvn -B verify
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reportes
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/

  frontend:
    name: Frontend · pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias (Vitest)
        run: npm run test:coverage
      - name: Build de producción
        run: npm run build
      - name: Auditoría de dependencias (solo vulnerabilidades altas)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-cobertura
          path: frontend/coverage/

  integracion:
    name: Integración · API y end-to-end con Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: http://localhost:8088
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de prueba con secretos aleatorios
        run: |
          {
            echo "APP_PORT=8088"
            echo "APP_URL=http://localhost:8088"
            echo "DB_USER=sigsu_app"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')"
            echo "COOKIE_SECURE=false"
            echo "SEED_ENABLED=true"
            echo "SEED_DEMO_PASSWORD=Demo1234"
          } > .env
      - name: Levantar MySQL + backend + gateway
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pruebas de API (Newman)
        run: |
          npx --yes newman@6.2.1 run tests/api/sigsu.postman_collection.json \
            -e tests/api/local.postman_environment.json \
            --reporters cli,junit --reporter-junit-export newman/resultados.xml
      - name: Pruebas end-to-end (Playwright)
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs de los contenedores si algo falla
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracion-reportes
          path: |
            newman/
            tests/e2e/playwright-report/
      - name: Apagar el stack
        if: always()
        run: docker compose down -v
